[project]
name = "tvbox_config"
version = "1.1.0"
description = "TVBox source checker and JSON generator"
readme = "README.md"
authors = [
    { name = "古月玄", email = "2651919937@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dirtyjson>=1.0.8",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "pycryptodome>=3.23.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.8",
    "ty>=0.0.81",
]

[project.scripts]
tvbox-config = "tvbox_config.app:main"
check = "tvbox_config._check:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tvbox_config"
module-root = "src"

[tool.ty.environment]
python = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/tvbox_config --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F", # 标准
    "I", # 导入
    "UP", "RUF", # 代码现代化
    "B", "BLE", "T10", # Bug
    "SIM", "C4", "PERF", "PIE", # 简化与性能
    "N", # 命名
    "PTH", # 路径
    # "ASYNC", # 异步（如项目用 asyncio 则保留，否则删掉）
    "PT", # 测试
    "TRY", # 异常
]
ignore = [
    "E501",    # 忽略超长行 (交给 ruff format 自动处理)
    "TRY003",  # 允许在 raise Exception(...) 中写长文字说明
]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
docstring-code-format = true
